<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Dhrub Kumar Garg — Software Developer</title>
  <desc id="desc">A navy banner with cyan and violet accents. I build. I solve. I keep learning. A code editor illustrates a learn, build, repeat loop.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#17132f"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <ellipse cx="1040" cy="130" rx="360" ry="260" fill="url(#glow)"/>
  <rect x="56" y="49" width="30" height="3" rx="1.5" fill="#67e8f9"/>
  <text x="98" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#a5b4fc">HELLO, WORLD</text>
  <text x="56" y="126" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="57" letter-spacing="-2" fill="#f8fafc">Dhrub Kumar Garg<tspan fill="#67e8f9">.</tspan></text>
  <text x="59" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#b6c2d9">Software developer · Problem solver · Always learning</text>
  <text x="56" y="229" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="29" fill="#e2e8f0">I build. I solve. <tspan fill="#a78bfa">I keep learning.</tspan></text>
  <rect x="58" y="267" width="186" height="30" rx="15" fill="#67e8f9" fill-opacity=".08" stroke="#67e8f9" stroke-opacity=".25"/>
  <text x="151" y="287" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#67e8f9">curiosity → creation</text>
  <g transform="translate(758 57)">
    <rect x="5" y="8" width="386" height="228" rx="14" fill="#070c18" fill-opacity=".5"/>
    <rect width="386" height="228" rx="14" fill="#101729" stroke="#35405f"/>
    <path d="M0 43H386" stroke="#29334d"/>
    <circle cx="21" cy="22" r="4" fill="#fb7185"/><circle cx="37" cy="22" r="4" fill="#fbbf24"/><circle cx="53" cy="22" r="4" fill="#34d399"/>
    <text x="365" y="26" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">mindset.js</text>
    <g font-family="Consolas, monospace" font-size="16">
      <text x="25" y="80" fill="#64748b">// Small steps. Better code.</text>
      <text x="25" y="117" fill="#c4b5fd">while <tspan fill="#e2e8f0">(curious) {</tspan></text>
      <text x="45" y="146" fill="#67e8f9">learn<tspan fill="#e2e8f0">();</tspan></text>
      <text x="45" y="175" fill="#67e8f9">build<tspan fill="#e2e8f0">();</tspan> <tspan fill="#67e8f9">repeat<tspan fill="#e2e8f0">();</tspan></tspan></text>
      <text x="25" y="204" fill="#e2e8f0">}<tspan fill="#a78bfa"> ▍</tspan></text>
    </g>
  </g>
  <rect x="56" y="337" width="1088" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
